<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>果园风险防控智能看板 · 管理员通道</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  :root {
    --bg-deep: #151a23;
    --bg-mid: #1e2634;
    --accent: #10b981;
    --accent-blue: #0ea5e9;
    --glass-bg: rgba(15, 23, 42, 0.65);
    --glass-border: rgba(255, 255, 255, 0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #1a2a3a 0%, #151a23 55%, #0f1419 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 背景科技网格 ── */
  .bg-grid {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(30, 58, 95, 0.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30, 58, 95, 0.12) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at 50% 40%, black 30%, transparent 70%);
  }

  /* ── 漂浮数据节点 ── */
  .data-node {
    position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, transparent 70%);
    animation: floatNode 8s ease-in-out infinite;
  }
  .data-node:nth-child(1) { width: 120px; height: 120px; top: 12%; left: 10%; animation-delay: 0s; }
  .data-node:nth-child(2) { width: 80px; height: 80px; top: 70%; left: 78%; animation-delay: -3s; background: radial-gradient(circle, rgba(14, 165, 233, 0.18) 0%, transparent 70%); }
  .data-node:nth-child(3) { width: 100px; height: 100px; top: 25%; left: 82%; animation-delay: -5s; }
  .data-node:nth-child(4) { width: 60px; height: 60px; top: 65%; left: 18%; animation-delay: -2s; background: radial-gradient(circle, rgba(14, 165, 233, 0.16) 0%, transparent 70%); }

  @keyframes floatNode {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
    50% { transform: translateY(-18px) scale(1.08); opacity: 0.85; }
  }

  /* ── 等高线光纹 ── */
  .contour-lines {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.06;
    background: repeating-radial-gradient(circle at 50% 45%, transparent 0, rgba(16, 185, 129, 0.3) 1px, transparent 2px, transparent 28px);
  }

  /* ── 玻璃拟态卡片 ── */
  .gatekeeper-card {
    position: relative; z-index: 10;
    width: 420px; max-width: 92vw;
    background: rgba(15, 23, 42, 0.7);
    backdrop-filter: blur(28px) saturate(140%);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 44px 40px 36px;
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.45),
      0 2px 8px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
    transition: all 0.3s ease;
  }

  /* ── Logo 区域 ── */
  .logo-mark {
    width: 52px; height: 52px; margin: 0 auto 18px;
    border-radius: 14px;
    background: linear-gradient(135deg, #10b981 0%, #059669 40%, #0d9488 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(16, 185, 129, 0.25);
  }

  /* ── 输入框容器 ── */
  .input-wrapper {
    position: relative; margin-top: 28px;
  }
  .input-wrapper input {
    width: 100%; height: 52px;
    padding: 0 48px 0 46px;
    background: rgba(30, 41, 59, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    color: #e2e8f0;
    font-size: 0.95rem;
    font-family: inherit;
    letter-spacing: 0.3px;
    outline: none;
    transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .input-wrapper input::placeholder {
    color: rgba(148, 163, 184, 0.55);
    font-weight: 400;
    letter-spacing: 0.2px;
  }
  .input-wrapper input:focus {
    border-color: #10b981;
    background: rgba(30, 41, 59, 0.75);
    box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12), 0 0 24px rgba(16, 185, 129, 0.06);
  }

  /* ── 图标定位 ── */
  .icon-lock {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    color: rgba(148, 163, 184, 0.5); pointer-events: none;
    transition: color 0.28s;
  }
  .input-wrapper input:focus ~ .icon-lock,
  .input-wrapper input:focus + .icon-lock { color: #10b981; }
  .icon-eye {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    color: rgba(148, 163, 184, 0.5); cursor: pointer; padding: 6px;
    transition: color 0.2s; background: none; border: none;
  }
  .icon-eye:hover { color: #e2e8f0; }

  /* ── 解锁按钮 ── */
  .btn-unlock {
    width: 100%; height: 52px; margin-top: 22px;
    border: none; border-radius: 14px;
    background: linear-gradient(135deg, #0f766e 0%, #10b981 45%, #34d399 100%);
    color: #fff; font-size: 1rem; font-weight: 600;
    font-family: inherit; letter-spacing: 0.4px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 4px 18px rgba(16, 185, 129, 0.28), 0 1px 4px rgba(0,0,0,0.2);
    transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative; overflow: hidden;
  }
  .btn-unlock::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.08) 50%, transparent 100%);
    opacity: 0; transition: opacity 0.28s;
  }
  .btn-unlock:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(16, 185, 129, 0.38), 0 2px 8px rgba(0,0,0,0.25);
  }
  .btn-unlock:hover::after { opacity: 1; }
  .btn-unlock:active { transform: translateY(0); }

  /* ── 错误提示 ── */
  .error-msg {
    margin-top: 14px; text-align: center; font-size: 0.82rem;
    color: #f87171; min-height: 22px; transition: all 0.2s;
  }
  .error-msg.shake { animation: shake 0.45s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  /* ── 底部安全标识 ── */
  .trust-footer {
    margin-top: 28px; padding-top: 18px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: flex; flex-direction: column; gap: 6px;
    align-items: center;
  }
  .trust-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.72rem; color: rgba(148, 163, 184, 0.6);
    font-weight: 400;
  }
  .pulse-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 6px rgba(34, 197, 94, 0.5);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(1.5); }
  }

  /* ── 响应式 ── */
  @media (max-width: 480px) {
    .gatekeeper-card { padding: 32px 24px 28px; border-radius: 20px; }
    .btn-unlock { font-size: 0.92rem; height: 48px; }
    .input-wrapper input { height: 48px; font-size: 0.88rem; }
  }
</style>
</head>
<body>

  <!-- 背景层 -->
  <div class="bg-grid"></div>
  <div class="contour-lines"></div>
  <div class="data-node"></div>
  <div class="data-node"></div>
  <div class="data-node"></div>
  <div class="data-node"></div>

  <!-- 登录卡片 -->
  <div class="gatekeeper-card">
    <!-- Logo -->
    <div class="logo-mark">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>

    <!-- 标题 -->
    <h1 style="text-align:center;font-size:1.3rem;font-weight:700;color:#f1f5f9;letter-spacing:0.5px;margin-bottom:6px;">
      果园风险防控智能看板
    </h1>
    <p style="text-align:center;font-size:0.8rem;color:rgba(148,163,184,0.65);font-weight:400;letter-spacing:0.2px;">
      内部算法管线与数据驾驶舱 · 管理员专属通道
    </p>

    <!-- 表单 -->
    <form id="loginForm" onsubmit="handleLogin(event)" autocomplete="off">
      <div class="input-wrapper">
        <input
          id="secretKey"
          type="password"
          placeholder="请输入管理员唯一访问秘钥..."
          autocomplete="off"
          spellcheck="false"
        >
        <!-- 锁图标 -->
        <svg class="icon-lock" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          <circle cx="12" cy="16" r="1"/>
        </svg>
        <!-- 眼睛切换 -->
        <button type="button" class="icon-eye" onclick="togglePassword()" aria-label="切换密码可见性">
          <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <button type="submit" class="btn-unlock" id="unlockBtn">
        <span>解锁并进入控制台</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>
    </form>

    <!-- 底部安全标识 -->
    <div class="trust-footer">
      <div class="trust-item">
        <span class="pulse-dot"></span>
        <span>AES-256 算法加密保护 · 传输层安全</span>
      </div>
      <div class="trust-item">
        <span class="pulse-dot" style="animation-delay: 1s;"></span>
        <span>数据刷新模式：实时监控中 · 内部算法管线 v3.1</span>
      </div>
    </div>
  </div>

<script>
  // ── 显示/隐藏密码 ──
  function togglePassword() {
    const input = document.getElementById('secretKey');
    const icon = document.getElementById('eyeIcon');
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    icon.innerHTML = isPassword
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="m14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }

  // ── 登录处理 ──
  async function handleLogin(e) {
    e.preventDefault();
    const key = document.getElementById('secretKey').value.trim();
    const errEl = document.getElementById('errorMsg');
    const btn = document.getElementById('unlockBtn');

    if (!key) {
      errEl.textContent = '请输入管理员访问秘钥';
      errEl.classList.add('shake');
      setTimeout(() => errEl.classList.remove('shake'), 450);
      return;
    }

    btn.disabled = true;
    btn.style.opacity = '0.7';
    btn.innerHTML = '<span>验证中...</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';

    try {
      const resp = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: key }),
      });
      const data = await resp.json();

      if (data.success) {
        errEl.textContent = '';
        errEl.style.color = '#34d399';
        errEl.textContent = '验证通过，正在进入控制台...';
        setTimeout(() => { window.location.href = '/'; }, 400);
      } else {
        errEl.textContent = data.error || '访问秘钥错误，请重试';
        errEl.style.color = '#f87171';
        errEl.classList.add('shake');
        setTimeout(() => errEl.classList.remove('shake'), 450);
        document.getElementById('secretKey').value = '';
        document.getElementById('secretKey').focus();
      }
    } catch (err) {
      errEl.textContent = '网络异常，请检查连接后重试';
      errEl.style.color = '#f87171';
    } finally {
      btn.disabled = false;
      btn.style.opacity = '1';
      btn.innerHTML = '<span>解锁并进入控制台</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
    }
  }

  // ── 回车提交 ──
  document.getElementById('secretKey').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleLogin(e);
  });

  // ── 页面加载自动聚焦 ──
  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('secretKey').focus();
  });
</script>

</body>
</html>
